<!DOCTYPE html>
<html>
<head>
    <title>Cross-Origin Install Fingerprinting POC</title>
</head>
<body>
    <h3>Test: Cross-Origin Fingerprinting via install()</h3>
    <button onclick="installAndCheck()">▶ Run Cross-Origin Test</button>
    <pre id="output"></pre>

    <script>
        // Situs A: Menginstall bahasa target
        const TARGET_LANG = 'id-ID';
        const TARGET_QUALITY = 'dictation';

        async function installAndCheck() {
            const output = document.getElementById('output');
            output.textContent = '⏳ Memulai pengujian...\n';

            try {
                // Step 1: Situs A menginstall paket bahasa (jika belum ada)
                // const installed = await SpeechRecognition.install({
                //     langs: [TARGET_LANG],
                //     quality: TARGET_QUALITY
                // });

                // Step 2: Situs B memeriksa ketersediaan
                const availability = await SpeechRecognition.available({
                    langs: [TARGET_LANG],
                    processLocally: true,
                    quality: TARGET_QUALITY
                });

                // Step 3: Inferensi
                let inference = '';
                if (availability === 'available') {
                    inference = '🔴 KOMBINASI TERDETEKSI: Pengguna pernah mengunjungi situs yang menginstal kombinasi ini.';
                } else if (availability === 'downloadable') {
                    inference = '🟡 Paket tersedia untuk diunduh, tetapi belum terinstal.';
                } else {
                    inference = '🟢 Paket tidak tersedia. Tidak ada indikasi kunjungan.';
                }

                output.textContent = `
╔═══════════════════════════════════════════════════════════════╗
║        CROSS-ORIGIN INSTALL FINGERPRINTING REPORT            ║
╠═══════════════════════════════════════════════════════════════╣
║                                                              ║
║ 🎯 TARGET:                                                   ║
║   Language: ${TARGET_LANG}                                   ║
║   Quality: ${TARGET_QUALITY}                                 ║
║                                                              ║
║ 🔍 AVAILABILITY CHECK:                                       ║
║   Result: ${availability}                                    ║
║                                                              ║
║ 🕵️ INFERENCE:                                                ║
║   ${inference}                                               ║
║                                                              ║
║ ⚠️ RISK ASSESSMENT:                                          ║
║   - Tidak memerlukan izin pengguna [citation:9]              ║
║   - Cross-origin tracking tanpa notifikasi [citation:3]      ║
║   - Data persisten bahkan setelah clear cookie               ║
║   - Diakui oleh W3C sebagai risiko fingerprinting [citation:2]║
║                                                              ║
╚═══════════════════════════════════════════════════════════════╝

📌 SUMBER:
  - W3C TAG Design Review #1189 [citation:2]
  - MDN: SpeechRecognition.install() [citation:9]
  - MDN: SpeechRecognition.available() [citation:4]
                `.trim();

            } catch (error) {
                output.textContent = `❌ Error: ${error.message}\n\nFitur ini mungkin belum didukung di browser Anda.`;
            }
        }
    </script>
</body>
</html>
