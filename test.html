<!DOCTYPE html>
<html>
<head>
    <title>Blob URI Spoofing Demo</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; text-align: center; }

    <p>Demo bagaimana <code>blob:</code> URI dapat digunakan untuk <span class="warning">menyembunyikan asal sebenarnya</span> 
    dari sebuah halaman di address bar.</p>
    
    <button onclick="spoofBlob()">▶ Open Spoofed Blob Page</button>
    <div id="output">Klik tombol untuk membuka halaman phishing dalam blob</div>

    <script>
        function spoofBlob() {
            const output = document.getElementById('output');
            
            // HTML phishing yang akan disimpan sebagai blob
            const phishingHTML = `
            <!DOCTYPE html>
            <html>
            <head>

                    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
                    button { width: 100%; padding: 12px; background: #0078d4; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
                    button:hover { background: #106ebe; }
                    .footer { font-size: 12px; color: #666; margin-top: 20px; }
                    .warning-demo { background: #fff3cd; padding: 10px; border-radius: 4px; font-size: 12px; color: #856404; }

            <body>

                    <input type="text" placeholder="Email, phone, or Skype">
                    <input type="password" placeholder="Password">
                    <button onclick="alert('⚠️ Demo: Kredensial Anda akan dicuri!')">Sign in</button>
                    <div class="warning-demo">
                        ⚠️ INI ADALAH DEMO PHISHING - Jangan masukkan kredensial asli!
                    </div>
                    <div class="footer">Perhatikan address bar: ini adalah blob: URI, bukan situs Microsoft asli</div>
                </div>
            </body>
            </html>
            `;

            // Buat blob dari HTML
            const blob = new Blob([phishingHTML], { type: 'text/html' });
            const blobURL = URL.createObjectURL(blob);

            // Buka di tab baru
            const newWindow = window.open(blobURL, '_blank');
            
            if (newWindow) {
                output.textContent = `

║                                                                  ║
║ 🎯 TEKNIK SPOOFING:                                              ║
║   - Halaman phishing disimpan sebagai blob di memori lokal       ║
