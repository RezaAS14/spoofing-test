            const utter = new SpeechSynthesisUtterance(fakeMessage);
            if (systemVoice) utter.voice = systemVoice;
            utter.rate = 0.9;
            utter.pitch = 1.0;
            
            speechSynthesis.speak(utter);

            output.textContent = `
