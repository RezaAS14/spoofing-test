<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Web Speech Quality Fingerprinting POC</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #output { 
            background: #f0f0f0; 
            padding: 15px; 
            border-radius: 5px; 
            margin-top: 20px; 
            white-space: pre-wrap;
            font-family: monospace;
        }
        .warning { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔬 Web Speech API: Quality Fingerprinting</h1>
    <p>Demonstrasi bagaimana parameter <code>quality</code> dapat digunakan untuk 
    <span class="warning">fingerprinting perangkat tanpa izin pengguna</span>.</p>
    <p>Isu ini telah diakui oleh W3C sebagai kekhawatiran privasi serius.</p>
    
    <button onclick="runFingerprint()">▶ Run Fingerprint Test</button>
    <div id="output">Klik tombol untuk memulai...</div>

    <script>
        async function runFingerprint() {
            const output = document.getElementById('output');
            output.textContent = '⏳ Mengumpulkan data fingerprint...\n';

            try {
                // Step 1: Kumpulkan daftar suara yang tersedia (fingerprint dimensi pertama)
                const voices = await getVoices();
                const voiceData = voices.map(v => ({
                    name: v.name,
                    lang: v.lang,
                    localService: v.localService,
                    default: v.default
                }));
                
                // Step 2: Deteksi tingkat kualitas pengenalan suara yang tersedia
                // (memanfaatkan API yang diusulkan: SpeechRecognition.available())
                const qualityLevels = await detectAvailableQuality();
                
                // Step 3: Gabungkan untuk membentuk fingerprint unik
                const fingerprint = generateFingerprint(voiceData, qualityLevels);
                
                // Step 4: Tampilkan hasil
                output.textContent = `
╔═══════════════════════════════════════════════════════════╗
║             WEB SPEECH FINGERPRINT REPORT                ║
╠═══════════════════════════════════════════════════════════╣
║                                                          ║
║ 📊 VOICE DATA:                                           ║
║   Total voices available: ${voiceData.length}             ║
║   Languages supported: ${[...new Set(voices.map(v => v.lang))].join(', ')} 
║                                                          ║
║ ⚙️ QUALITY LEVELS AVAILABLE:                             ║
║   ${qualityLevels.map(q => `✓ ${q}`).join('\n   ')}      ║
║                                                          ║
║ 🆔 FINGERPRINT HASH:                                     ║
║   ${fingerprint.hash}                                    ║
║                                                          ║
║ ⚠️  DIMENSI FINGERPRINT:                                 ║
║   Voice count (${voiceData.length}) + Quality levels (${qualityLevels.length}) 
║   = ${voiceData.length + qualityLevels.length} entropi   ║
║                                                          ║
╚═══════════════════════════════════════════════════════════╝

📌 CATATAN:
  - Tidak ada izin pengguna yang diperlukan
  - Tidak ada indikasi visual
  - Data ini dapat digunakan untuk pelacakan lintas-situs
  - Isu ini diakui oleh W3C (design-review #1189)

🔗 Referensi: 
  - https://github.com/w3ctag/design-reviews/issues/1189
  - https://github.com/WebAudio/web-speech-api/pull/165
                `.trim();

            } catch (error) {
                output.textContent = `❌ Error: ${error.message}\n\nPastikan browser Anda mendukung Web Speech API.`;
            }
        }

        // Fungsi untuk mendapatkan daftar suara
        function getVoices() {
            return new Promise((resolve) => {
                let voices = speechSynthesis.getVoices();
                if (voices.length > 0) {
                    resolve(voices);
                } else {
                    speechSynthesis.onvoiceschanged = () => {
                        resolve(speechSynthesis.getVoices());
                    };
                }
            });
        }

        // Fungsi untuk mendeteksi tingkat kualitas yang tersedia
        // (menggunakan API yang diusulkan: SpeechRecognition.available())
        async function detectAvailableQuality() {
            const qualityLevels = ['command', 'dictation', 'conversation'];
            const available = [];
            
            // Simulasi deteksi kualitas berdasarkan kemampuan perangkat
            // Dalam implementasi nyata, ini akan menggunakan:
            // await SpeechRecognition.available({ 
            //     langs: ['en-US'], 
            //     processLocally: true, 
            //     quality: level 
            // });
            
            // Simulasi: sebagian besar perangkat modern mendukung 'command'
            available.push('command');
            
            // Deteksi fitur browser sebagai proxy untuk kemampuan perangkat
            const hasHardwareAcceleration = 'WebGL2RenderingContext' in window;
            const hasHighPerformance = 'performance' in window && 
                                       performance.memory !== undefined;
            
            // Perangkat dengan kemampuan lebih tinggi mendukung dictation
            if (hasHardwareAcceleration || navigator.hardwareConcurrency > 4) {
                available.push('dictation');
            }
            
            // Perangkat high-end mendukung conversation
            if (hasHighPerformance && navigator.hardwareConcurrency > 8) {
                available.push('conversation');
            }
            
            // Tambahkan informasi model on-device yang terdeteksi
            // (bisa diperkaya dengan informasi dari SpeechRecognition.install)
            try {
                // Simulasi install untuk mendeteksi ketersediaan
                // Dalam implementasi nyata, ini akan menggunakan:
                // await SpeechRecognition.install({
                //     langs: ['en-US'],
                //     processLocally: true,
                //     quality: 'conversation'
                // });
                // available.push('conversation');
            } catch (e) {
                // Model tidak tersedia - lewati
            }
            
            return available;
        }

        // Fungsi untuk menghasilkan hash fingerprint
        function generateFingerprint(voiceData, qualityLevels) {
            // Gabungkan data menjadi string
            const dataString = JSON.stringify({
                voiceCount: voiceData.length,
                voiceNames: voiceData.map(v => v.name).sort().join('|'),
                voiceLangs: voiceData.map(v => v.lang).sort().join('|'),
                qualityLevels: qualityLevels.sort().join('|'),
                // Tambahkan entropi dari platform
                platform: navigator.platform,
                hardwareConcurrency: navigator.hardwareConcurrency || 0,
                userAgent: navigator.userAgent.split('/')[0] // Agent name only
            });
            
            // Simple hash function
            let hash = 0;
            for (let i = 0; i < dataString.length; i++) {
                const char = dataString.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32-bit integer
            }
            
            return {
                hash: hash,
                dataString: dataString
            };
        }
    </script>
</body>
</html>
